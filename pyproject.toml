[project]
name = "etf-pairs-research"
version = "0.2.0"
description = "Reproducible ETF pairs research with causal daily execution benchmarks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2,<2.3",
    "pandas>=2.2,<3",
    "statsmodels>=0.14,<0.15",
    "yfinance>=0.2,<1",
    "hmmlearn>=0.3,<0.4",
    "matplotlib>=3.9,<4",
    "requests>=2.32,<3",
    "scipy>=1.15,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<0.12"]

[project.scripts]
pairs-experiment = "pairs_research.experiment:main"
pairs-alpaca-dry-run = "pairs_research.dry_run:main"
pairs-replay = "pairs_research.replay:main"
pairs-research = "pairs_research.run_pipeline:main"
pairs-check-environment = "pairs_research.check_environment:main"

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["pairs_trading/src"]
include = ["pairs_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
