[project]
name = "stochcontrol"
version = "0.1.0"
description = "Stochastic execution control research package"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "statsmodels",
    "yfinance"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
