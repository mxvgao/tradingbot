name: Research core
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - run: uv sync --frozen
      - run: uv run --frozen pairs-check-environment
      - run: uv run --frozen ruff check pairs_trading/src tests
      - run: uv run --frozen pytest
      - run: uv build
      - name: Test installed wheel outside checkout
        run: |
          uv venv /tmp/pairs-wheel --python 3.12.12
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/pairs-requirements.txt
          uv pip install --python /tmp/pairs-wheel/bin/python -r /tmp/pairs-requirements.txt dist/*.whl
          cd /tmp
          /tmp/pairs-wheel/bin/python -c "import pairs_research; import importlib.util; assert importlib.util.find_spec('stochcontrol') is None"
          /tmp/pairs-wheel/bin/pairs-research --help
          /tmp/pairs-wheel/bin/pairs-replay --help
